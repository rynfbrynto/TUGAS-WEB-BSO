<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Katalog Toko Online Dinamis terhubung langsung ke WhatsApp">
  <title id="store-page-title">Katalog Toko</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- Header / Identitas Toko -->
  <header class="store-header" id="store-header">
    <div class="container header-container">
      <div class="store-brand">
        <div class="store-info">
          <h1 id="store-name" class="store-name">Memuat Nama Toko...</h1>
          <p id="store-slogan" class="store-slogan">Silakan tunggu sebentar</p>
        </div>
      </div>
      <div class="header-action">
        <a id="btn-admin-wa" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-wa-direct">
          <svg class="icon-wa" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
          </svg>
          <span>Hubungi Admin</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Area Utama / Katalog Produk -->
  <main class="main-content">
    <div class="container">
      <!-- Section Toolbar: Pencarian & Filter Kategori -->
      <section class="toolbar-section" aria-label="Navigasi Katalog">
        <div class="search-box">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="input-search" placeholder="Cari nama produk..." autocomplete="off">
        </div>
        <div class="category-filters" id="category-filters">
          <button class="filter-btn active" data-category="all">Semua</button>
        </div>
      </section>

      <!-- Status Loading & Error -->
      <div id="loading-state" class="state-container loading-state">
        <div class="spinner"></div>
        <p>Memuat daftar produk dari katalog...</p>
      </div>

      <div id="error-state" class="state-container error-state" style="display: none;">
        <p id="error-message">Gagal mengambil data katalog. Silakan coba lagi nanti.</p>
        <button id="btn-retry" class="btn btn-secondary">Muat Ulang</button>
      </div>

      <!-- Grid Daftar Produk -->
      <section class="products-section" aria-label="Daftar Produk">
        <div id="product-grid" class="products-grid"></div>
        <div id="empty-state" class="state-container empty-state" style="display: none;">
          <p>Produk tidak ditemukan.</p>
        </div>
      </section>
    </div>
  </main>

  <!-- Footer Toko -->
  <footer class="store-footer">
    <div class="container footer-container">
      <p>&copy; <span id="footer-year">2026</span> <span id="footer-store-name">Katalog Toko</span>. Didukung oleh Google Sheets & WhatsApp.</p>
    </div>
  </footer>

  <!-- Script Modular (ES6 Modules) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
